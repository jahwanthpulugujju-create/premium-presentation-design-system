name: PPD quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate concept briefs
        run: npm run validate:examples

      - name: Build editable PowerPoint proof
        run: npm run build:demo

      - name: Upload proof deck
        uses: actions/upload-artifact@v4
        with:
          name: ppd-three-concept-proof
          path: artifacts/ppd-three-concept-proof.pptx
          if-no-files-found: error
